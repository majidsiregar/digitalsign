<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DigitalSign</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-logo h1 {
      font-size: 26px;
      font-weight: 700;
    }

    .login-tagline {
      text-align: center;
      color: var(--gray-500);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .login-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 15px;
      color: var(--gray-800);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: white;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }

    .error-msg.show {
      display: block;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .spinner-inline {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M9 15l2 2 4-4"/>
      </svg>
      <h1>DigitalSign</h1>
    </div>
    <p class="login-tagline">Tanda tangani dokumen PDF dengan mudah</p>

    <div class="login-card">
      <h2>Masuk ke Akun</h2>

      <div class="error-msg" id="errorMsg">Username atau password salah.</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Masuk</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var btn = document.getElementById('loginBtn');
      var errorMsg = document.getElementById('errorMsg');
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      errorMsg.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>Memproses...';

      try {
        var res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        var data = await res.json();

        if (res.ok && data.token) {
          sessionStorage.setItem('authToken', data.token);
          window.location.replace('/');
        } else {
          errorMsg.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Masuk';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal terhubung ke server. Coba lagi.';
        errorMsg.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
